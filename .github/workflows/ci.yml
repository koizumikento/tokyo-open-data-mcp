name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - name: Verify clean wheel install
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$WHEEL" python - <<'PY'
          import asyncio
          from tokyo_open_data_mcp import create_server

          assert len(asyncio.run(create_server().list_tools())) == 1
          PY
